<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>วิธีสั่งซื้อสินค้าจากจีน · Oversea PenGate</title>
<meta name="description" content="ขั้นตอนการสั่งซื้อและนำเข้าสินค้าจากจีน — Taobao / Tmall / 1688"/>
<link rel="icon" href="/logo.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet"/>
<style>
:root{--brand:#9C8654;--brand-600:#7C6739;--brand-700:#63522C;--brand-50:#F6F0E1;--brand-100:#E7DBC0;--ink:#3C3526;--ink-soft:#7C715B;--bg:#FAF6EE;--border:#ECE2CE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6}
.top{background:linear-gradient(90deg,#B89865,#9C8654);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top h1{font-family:'Playfair Display',serif;font-size:20px;color:#fff;flex:1}
.top a{color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:32px 18px 60px}
.hero-title{text-align:center;margin-bottom:26px}
.hero-title h2{font-family:'Playfair Display',serif;font-size:32px;color:var(--brand-700);margin-bottom:6px}
.hero-title p{font-size:14px;color:var(--ink-soft)}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tab{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 22px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--brand-700);display:flex;align-items:center;gap:8px;transition:.15s;min-width:180px;justify-content:center}
.tab .em{font-size:22px}
.tab.active{background:linear-gradient(135deg,var(--brand-600),var(--brand-700));color:#fff;border-color:var(--brand-600);box-shadow:0 6px 18px rgba(124,103,57,.28)}
.video-card{background:#000;border-radius:14px;overflow:hidden;margin-bottom:28px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#aaa}
.video-card video{width:100%;height:100%;display:block;object-fit:contain}
.video-empty{padding:60px 20px;text-align:center;color:#aaa;font-size:14px}
.steps-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.steps-wrap.single{grid-template-columns:1fr;max-width:560px;margin:0 auto}
@media(max-width:720px){.steps-wrap{grid-template-columns:1fr}}
.step-col{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 4px 14px rgba(124,103,57,.08)}
.step-col .sub{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--brand);text-align:center;margin-bottom:6px}
.step-col h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--brand-700);text-align:center;margin-bottom:14px}
.step-col .hub{text-align:center;font-size:30px;margin-bottom:12px}
.row{display:grid;grid-template-columns:32px 34px 1fr;gap:10px;align-items:start;padding:9px 6px;border-top:1px dashed var(--border);font-size:13.5px}
.row:first-of-type{border-top:0}
.row .step{width:28px;height:28px;background:var(--brand-50);color:var(--brand-700);border:1.5px solid var(--brand-100);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
.row .ic{font-size:22px}
.row small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
</style>
</head>
<body>
<div class="top">
  <a href="/">← หน้าหลัก</a>
  <h1>📹 วิธีสั่งซื้อ</h1>
</div>
<div class="wrap">
  <div class="hero-title">
    <h2>ขั้นตอนการสั่งซื้อสินค้าจากจีน</h2>
    <p>เลือกดูวิดีโอตามบริการที่ต้องการ</p>
  </div>
  <div class="tabs">
    <button class="tab active" data-how="order"><span class="em">🛒</span> ฝากสั่งซื้อ</button>
    <button class="tab" data-how="import"><span class="em">📦</span> นำเข้าสินค้า</button>
    <button class="tab" data-how="pay"><span class="em">💴</span> ฝากจ่ายเงิน</button>
  </div>
  <div class="video-card" id="videoWrap"></div>
  <div class="steps-wrap" id="stepsWrap"></div>
</div>

<script>
const VIDEOS={ order:'/video-how-to-order.mp4', import:'', pay:'' };
const ORDER_STEPS=[
  {n:1,ic:'🔐',t:'เปิดรหัสสมาชิกกับ Oversea PenGate'},
  {n:2,ic:'📝',t:'กรอกแบบฟอร์มการสั่งซื้อสินค้า'},
  {n:3,ic:'🧮',t:'ทีมงานสรุปยอดการชำระเงินงวดที่ 1',s:'(ค่าสินค้า + ค่าขนส่งในจีน)'},
  {n:4,ic:'💳',t:'ลูกค้าชำระเงินงวดที่ 1'},
  {n:5,ic:'📦',t:'พนักงานโกดังจีนอัปเดตสถานะสินค้าเข้าโกดัง'},
  {n:6,ic:'🚢',t:'สินค้าขึ้นตู้ส่งมายังไทย'},
  {n:7,ic:'🏠',t:'สินค้าเข้าโกดังไทย',s:'ทีมงานแจ้งลูกค้ารับของ/จัดส่ง'},
  {n:8,ic:'💰',t:'ลูกค้าชำระค่านำเข้าสินค้า'}
];
const IMPORT_STEPS=[
  {n:1,ic:'🔐',t:'เปิดรหัสสมาชิกกับ Oversea PenGate'},
  {n:2,ic:'📮',t:'ส่งสินค้ามาตามที่อยู่โกดังจีน'},
  {n:3,ic:'📦',t:'พนักงานโกดังจีนอัปเดตสถานะสินค้าเข้าโกดัง'},
  {n:4,ic:'🚢',t:'สินค้าขึ้นตู้ส่งมายังไทย'},
  {n:5,ic:'🏠',t:'สินค้าเข้าโกดังไทย',s:'ทีมงานแจ้งลูกค้ารับของ/จัดส่ง'},
  {n:6,ic:'💰',t:'ชำระค่านำเข้าสินค้า'}
];

function stepCol(sub,title,hub,list){
  if(!list.length) return '<div class="step-col"><div class="sub">'+sub+'</div><h3>'+title+'</h3><div class="hub">'+hub+'</div><div style="text-align:center;color:#aaa;padding:14px 0;font-size:13px">รายละเอียดขั้นตอนกำลังจัดทำ</div></div>';
  return '<div class="step-col"><div class="sub">'+sub+'</div><h3>'+title+'</h3><div class="hub">'+hub+'</div>'+list.map(function(r){
    return '<div class="row"><span class="step">'+r.n+'</span><span class="ic">'+r.ic+'</span><span>'+r.t+(r.s?'<small>'+r.s+'</small>':'')+'</span></div>';
  }).join('')+'</div>';
}

function render(kind){
  const wrap=document.getElementById('videoWrap');
  const stepsWrap=document.getElementById('stepsWrap');
  const url=VIDEOS[kind];
  if(url){
    wrap.innerHTML='<video controls playsinline preload="metadata"><source src="'+url+'" type="video/mp4">เบราว์เซอร์ไม่รองรับ</video>';
  } else {
    wrap.innerHTML='<div class="video-empty">🎬 วิดีโอกำลังจัดทำ<br><span style="font-size:12px">เร็วๆ นี้</span></div>';
  }
  stepsWrap.classList.remove('single');
  if(kind==='order'){
    stepsWrap.innerHTML = stepCol('ORDER','🛒 ขั้นตอนการสั่งซื้อ','🚚',ORDER_STEPS) + stepCol('IMPORT','🚢 ขั้นตอนการนำเข้าสินค้า','📦',IMPORT_STEPS);
  } else if(kind==='import'){
    stepsWrap.classList.add('single');
    stepsWrap.innerHTML = stepCol('IMPORT','🚢 ขั้นตอนการนำเข้าสินค้า','📦',IMPORT_STEPS);
  } else {
    stepsWrap.classList.add('single');
    stepsWrap.innerHTML = stepCol('PAY','💴 ขั้นตอนการฝากจ่ายเงิน','💴',[]);
  }
}

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    render(b.dataset.how);
  });
});

render('order');
</script>
<script src="/i18n.js" defer></script>
<script src="/line-fab.js" defer></script>
</body>
</html>
